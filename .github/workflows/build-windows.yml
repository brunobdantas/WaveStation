name: Build WaveStation Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'overlay/**'
      - 'tools/**'
      - 'tests/**'
      - 'SOURCE_REVISION.txt'
      - 'THIRD_PARTY_NOTICES.md'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout WaveStation
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 5.12.12 and MinGW 7.3 x64
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.12.12'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw73'
          cache: true
          tools: 'tools_mingw,qt.tools.win64_mingw730'

      - name: Verify toolchain
        shell: pwsh
        run: |
          qmake -v
          g++ --version
          mingw32-make --version
          & "$env:pythonLocation\python.exe" --version

      - name: Download pinned MSHV source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path work | Out-Null
          $zip = Join-Path $PWD 'work\mshv.zip'
          Invoke-WebRequest -Uri 'https://github.com/LZ2HV/MSHV/archive/8f93eb3e25056f0cb18699ef6c3bef3998c52cdf.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath 'work' -Force
          $src = Get-ChildItem 'work' -Directory | Where-Object { $_.Name -like 'MSHV-*' } | Select-Object -First 1
          if (-not $src) { throw 'Pinned MSHV source was not extracted.' }
          "MSHV_SOURCE=$($src.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply WaveStation RTTY integration
        shell: pwsh
        run: |
          & "$env:pythonLocation\python.exe" tools/apply_mshv_rtty.py --source "$env:MSHV_SOURCE" --output "$PWD\work\WaveStation-src" --package-root "$PWD"
          if ($LASTEXITCODE -ne 0) { throw "integration patch failed with exit code $LASTEXITCODE" }

      - name: Apply RTTY operating presets
        shell: pwsh
        run: |
          & "$env:pythonLocation\python.exe" tools/apply_rtty_presets.py --source "$PWD\work\WaveStation-src"
          if ($LASTEXITCODE -ne 0) { throw "RTTY preset patch failed with exit code $LASTEXITCODE" }

      - name: Run standalone RTTY modem tests
        shell: pwsh
        run: |
          g++ -std=gnu++11 -Wall -Wextra -O2 tests/test_rtty.cpp overlay/src/HvRtty/rtty_core.cpp -o work/rtty_test.exe
          if ($LASTEXITCODE -ne 0) { throw "RTTY modem test compilation failed with exit code $LASTEXITCODE" }
          & .\work\rtty_test.exe
          if ($LASTEXITCODE -ne 0) { throw "RTTY modem test failed with exit code $LASTEXITCODE" }

      - name: Build WaveStation
        shell: pwsh
        working-directory: work/WaveStation-src
        run: |
          qmake MSHV_WIN64.pro CONFIG+=release
          if ($LASTEXITCODE -ne 0) { throw "qmake failed with exit code $LASTEXITCODE" }
          mingw32-make -j2
          if ($LASTEXITCODE -ne 0) { throw "build failed with exit code $LASTEXITCODE" }

      - name: Package Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceBin = Join-Path $PWD 'work\WaveStation-src\bin'
          $dist = Join-Path $PWD 'dist'
          if (-not (Test-Path $sourceBin)) { throw 'MSHV runtime bin directory not found.' }
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # MSHV is not a single-file application. Its runtime tree contains
          # settings, databases and writable working directories expected at startup.
          Copy-Item (Join-Path $sourceBin '*') $dist -Recurse -Force

          $exe = Get-ChildItem $dist -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'No Windows executable found in packaged runtime tree.' }
          $target = Join-Path $dist 'WaveStation.exe'
          if ($exe.FullName -ne $target) {
            Copy-Item $exe.FullName $target -Force
            Remove-Item $exe.FullName -Force
          }

          # Fail the build if the upstream runtime structure required by startup is absent.
          $required = @(
            'settings',
            'settings\ms_settings',
            'settings\database',
            'log',
            'RxWavs',
            'ExportLog',
            'Screenshots'
          )
          foreach ($rel in $required) {
            $p = Join-Path $dist $rel
            if (-not (Test-Path $p)) { throw "Required runtime path missing from artifact: $rel" }
          }

          # Never ship the upstream author's personal/demo QSO records.
          $adi = @(
            'WaveStation alpha 2.76.7 64-bit ADIF Log',
            '<ADIF_VER:5>3.1.0',
            '<PROGRAMID:11>WaveStation',
            '<PROGRAMVERSION:6>2.76.7',
            '<EOH>'
          ) -join "`r`n"
          Set-Content -Path (Join-Path $dist 'log\mshvlog.adi') -Value $adi -Encoding ascii
          Set-Content -Path (Join-Path $dist 'log\mshvlog.edim') -Value '[QSORecords; MSHV LOG FILE ID=20231018-273]' -Encoding ascii

          $deploy = Get-Command windeployqt.exe -ErrorAction SilentlyContinue
          if ($deploy) {
            & $deploy.Source --release --no-translations $target
            if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }
          }

          Copy-Item README.md $dist -Force
          Copy-Item SOURCE_REVISION.txt $dist -Force
          Copy-Item THIRD_PARTY_NOTICES.md $dist -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WaveStation.exe" | Set-Content -Encoding ascii (Join-Path $dist 'SHA256SUMS.txt')
          Get-ChildItem $dist -Recurse | Format-Table FullName, Length

      - name: Startup smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist'
          $exe = Join-Path $dist 'WaveStation.exe'
          if (-not (Test-Path $exe)) { throw 'WaveStation.exe missing before smoke test.' }

          # Regression guard for the real failure mode reported by the operator:
          # splash screen appears and the process dies during Main_Ms startup.
          $proc = Start-Process -FilePath $exe -WorkingDirectory $dist -PassThru
          Start-Sleep -Seconds 10
          $proc.Refresh()
          if ($proc.HasExited) {
            $code = $proc.ExitCode
            throw "WaveStation startup smoke test failed: process exited after splash (exit code $code)."
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host 'WaveStation startup smoke test passed: process remained alive beyond splash.'

      - name: Upload WaveStation artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaveStation-Windows-x64
          path: dist/**
          if-no-files-found: error
          retention-days: 14
