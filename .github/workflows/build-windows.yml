name: MSHV Enhanced Foundation CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'tools/**'
      - 'src/**'
      - 'SOURCE_REVISION.txt'
      - 'README.md'

permissions:
  contents: read

jobs:
  validate-foundation:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate MSHV Enhanced patcher
        shell: pwsh
        run: |
          python -m py_compile tools/apply_mshv_enhanced.py
          if ($LASTEXITCODE -ne 0) { throw 'Patcher syntax failed' }

      - name: Verify pinned upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = '50ea1a7b5bf20c688ccc72107e389f06673deac6'
          git clone --filter=blob:none --no-checkout https://github.com/LZ2HV/MSHV.git upstream
          git -C upstream fetch origin $sha
          git -C upstream checkout $sha
          $actual = (git -C upstream rev-parse HEAD).Trim()
          if ($actual -ne $sha) { throw "Unexpected upstream: $actual" }
          Write-Host "MSHV 2.76.8 rc008 verified: $actual"

      - name: Apply MSHV Enhanced patch to 2.76.8
        shell: pwsh
        run: |
          python tools/apply_mshv_enhanced.py upstream
          if ($LASTEXITCODE -ne 0) { throw 'MSHV Enhanced patch is not compatible with pinned upstream' }
          git -C upstream diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patched upstream diff check failed' }
          git -C upstream diff --stat

      - name: Report foundation status
        shell: pwsh
        run: |
          Write-Host 'MSHV Enhanced patch applies cleanly to MSHV 2.76.8 rc008.'
